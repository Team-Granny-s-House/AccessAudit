<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review your booking · SkyRail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-review">
  <header class="site-header">
    <div class="bar">
      <a class="wordmark" href="index.html">
        <svg aria-hidden="true" viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="20" rx="6" fill="#FFFFFF"/><rect x="9" y="8" width="14" height="7" rx="2" fill="#0F4C81"/><circle cx="11" cy="19" r="2" fill="#0F4C81"/><circle cx="21" cy="19" r="2" fill="#0F4C81"/><path d="M9 28 L12 24 M23 28 L20 24" stroke="#FFFFFF" stroke-width="2"/></svg>
        SkyRail
      </a>
      <span class="bar-note">Fictional demo site</span>
    </div>
  </header>

  <main>
    <h1>Review your booking</h1>
    <div class="review">
      <section class="panel summary" aria-labelledby="trip-title">
        <h2 id="trip-title">Your train</h2>
        <dl id="trip-summary">
          <dt>Train</dt><dd data-field="name">SkyRail Swift 2101</dd>
          <dt>Route</dt><dd>New Delhi to Mumbai</dd>
          <dt>Date</dt><dd data-field="date">Fri 24 Oct</dd>
          <dt>Departs</dt><dd data-field="depart">06:10</dd>
          <dt>Arrives</dt><dd data-field="arrive">14:25</dd>
          <dt>Fare</dt><dd data-field="fare">₹1,845</dd>
        </dl>
      </section>

      <section class="panel" aria-labelledby="pax-title">
        <h2 id="pax-title">Passenger details</h2>
        <span class="field-label">Passenger name</span>
        <input type="text" id="passenger" name="passenger">
        <div class="pay-row">
          <button type="button" class="btn" id="pay-btn">Pay now</button>
          <p class="pay-status" id="pay-status" role="status"></p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>SkyRail is a fictional site for accessibility testing. No real trains, tickets or payments.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
